[package]
name = "sts2_sim"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "CPU-native STS2 simulator ported directly from the frozen r7 Python sts2_env"

[features]
# Offline recorder only. Normal encoders never bypass selector admission.
selector-proof = []

[dependencies]
# Latest stable release checked with cargo search on 2026-10-25.
arrayvec = "=0.7.8"
# Latest stable checked on crates.io 2026-11-03; inline storage spills instead of imposing a game limit.
smallvec = { version = "=1.16.4", features = ["const_generics", "union"] }
sts2_wire = { path = "../wire" }
# Already in the workspace lockfile (native_obs); digests of the admitted selector shapes.
sha2 = "=0.11.1"

[build-dependencies]
serde_json = "=1.0.154"
syn = { version = "=3.0.9", features = ["full"] }

[dev-dependencies]
# Latest stable releases checked with cargo search on 2026-10-25.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
