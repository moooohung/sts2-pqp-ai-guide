[package]
name = "sts2_policy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "r7 relational candidate policy + PPO in Rust (burn), CPU backend"

[features]
default = ["obs-v2"]
# This integrated tree includes NativeObsV2; plain heads still select V1 compatibility.
obs-v2 = []

[dependencies]
# Latest stable from cargo search on 2026-10-24. burn 0.22: CPU (flex) backend;
# autodiff + optim for PPO. The CUDA and PyTorch-import features of the private
# tree are not part of this export.
burn = { version = "=0.22.1", default-features = false, features = ["std", "optim", "flex", "safetensors"] }
safetensors = "=0.8.0"
serde_json = "=1.0.154"
# Registry checked 2026-10-29; owned prefetched observations are checkpointed.
serde = { version = "=1.0.229", features = ["derive"] }
# Registry checked 2026-10-29; identical erf implementation to Burn Flex GELU.
libm = "=0.2.16"
sts2_wire = { path = "../wire" }
sts2_native_obs = { path = "../native_obs" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Keep the lockfile's entropy version; browser inference needs the JS backend.
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[dev-dependencies]
sts2_sim = { path = "../sim" }
