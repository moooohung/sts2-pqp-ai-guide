[package]
name = "sts2_native_obs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Versioned Rust-native observation schema and caller-owned buffers"

[build-dependencies]
# Registry versions checked on 2026-10-28; no runtime dependency graph.
serde_json = "=1.0.154"
sha2 = "=0.11.1"
syn = { version = "=3.0.9", features = ["full"] }

[dependencies]
sts2_sim = { path = "../sim" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[dev-dependencies]
serde_json = "=1.0.154"
